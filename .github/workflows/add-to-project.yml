name: Add Issue to Project
on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to projects
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/trieuluan1605/projects/1
          github-token: ${{ secrets.PROJECT }}
